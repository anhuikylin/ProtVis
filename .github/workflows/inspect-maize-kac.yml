name: Inspect maize Kac benchmark

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/inspect-maize-kac.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download Maize PeptideAtlas HR-HCD library
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 \
            --output /tmp/maize_hr_hcd.sptxt.gz \
            https://peptideatlas.org/builds/maize/202308/maize_2023-08_all_HR-HCD.sptxt.gz
          ls -lh /tmp/maize_hr_hcd.sptxt.gz

      - name: Rank lysine-acetylated spectra
        shell: python
        run: |
          import gzip, re, math, json

          path = "/tmp/maize_hr_hcd.sptxt.gz"
          entries = []
          current = {}

          def finalize(e):
              if not e or "Comment" not in e:
                  return
              comment = e.get("Comment", "")
              name = e.get("Name", "")
              # Require an acetyl modification explicitly assigned to K.
              if not re.search(r"(?:,K,Acetyl|K[^; ]*Acetyl|Acetyl[^; ]*K)", comment, re.I):
                  return

              num_peaks = int(e.get("NumPeaks", "0") or 0)
              m_nreps = re.search(r"\bNreps=(\d+)", comment)
              nreps = int(m_nreps.group(1)) if m_nreps else 0

              prob = 0.0
              for key in ("Prob", "PepProb", "iProphet", "PeptideProphet"):
                  m = re.search(rf"\b{key}=([0-9.]+)", comment, re.I)
                  if m:
                      prob = max(prob, float(m.group(1)))

              # Penalize multi-acetyl entries for a clean single-site benchmark.
              mods = re.findall(r"(\d+),([A-Z]),([^/ ]+)", comment)
              acetyl_mods = [m for m in mods if "acetyl" in m[2].lower() and m[1] == "K"]
              single_kac = len(acetyl_mods) == 1

              source = ""
              for pattern in (
                  r"RawSpectrum=([^ ]+)", r"Spectrum=([^ ]+)",
                  r"Sample=([^ ]+)", r"Spec=([^ ]+)"
              ):
                  m = re.search(pattern, comment)
                  if m:
                      source = m.group(1)
                      break

              score = (1000 if single_kac else 0) + min(nreps, 100) * 10 + prob * 100 + min(num_peaks, 300) / 10
              entries.append({
                  "score": round(score, 3),
                  "name": name,
                  "full_name": e.get("FullName", ""),
                  "precursor_mz": e.get("PrecursorMZ", ""),
                  "num_peaks": num_peaks,
                  "nreps": nreps,
                  "prob": prob,
                  "single_kac": single_kac,
                  "source": source,
                  "comment": comment[:2500],
              })

          with gzip.open(path, "rt", errors="replace") as fh:
              for line in fh:
                  line = line.rstrip("\n")
                  if not line:
                      finalize(current)
                      current = {}
                      continue
                  if ": " in line and not line[:1].isdigit():
                      key, value = line.split(": ", 1)
                      if key in {"Name","FullName","PrecursorMZ","Comment","NumPeaks","LibID","MW","Status"}:
                          current[key] = value
              finalize(current)

          entries.sort(key=lambda x: x["score"], reverse=True)
          print(f"KAC_ENTRIES={len(entries)}")
          for i, e in enumerate(entries[:30], 1):
              print("CANDIDATE", i, json.dumps(e, ensure_ascii=False))
