name: Test maize Kac runtime

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/test-maize-kac-runtime.yml"

permissions:
  contents: write

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ProtVis
        uses: actions/checkout@v4

      - name: Checkout ProtVisDatabase
        uses: actions/checkout@v4
        with:
          repository: anhuikylin/ProtVisDatabase
          ref: main
          path: ProtVisDatabase

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install minimal PTM dependencies
        shell: Rscript {0}
        run: |
          install.packages("BiocManager")
          BiocManager::install(
            c("Spectra", "MsBackendMgf", "PSMatch", "BiocParallel"),
            ask = FALSE,
            update = FALSE
          )
          install.packages(
            "ProtVisDatabase",
            repos = NULL,
            type = "source",
            lib = .libPaths()[1],
            INSTALL_opts = "--no-multiarch"
          )

      - name: Run real maize Kac spectrum pipeline
        shell: Rscript {0}
        run: |
          source("R/ptm_vac14.R")

          target <- .protvis_maize_kac_target()
          stopifnot(
            identical(target$sequence, "VGYNPDKIAFVPISGFEGDNMIER"),
            identical(
              target$modified_sequence,
              "VGYNPDK[Acetyl]IAFVPISGFEGDNMIER"
            ),
            target$acetyl_position == 7L,
            abs(target$acetyl_mass - 42.010565) < 1e-8,
            target$precursor_charge == 3L
          )

          bundle <- .protvis_maize_kac_bundle()
          stopifnot(
            nrow(bundle$catalog) == 1L,
            length(bundle$spectra) == 1L,
            identical(bundle$catalog$modified_sequence[[1L]],
                      "VGYNPDK[Acetyl]IAFVPISGFEGDNMIER")
          )

          result <- .protvis_ptm_run_selected(
            bundle,
            bundle$catalog$psm_index[[1L]],
            tolerance_da = 0.5
          )

          stopifnot(
            identical(
              result$target$benchmark_id,
              "maize_kac_peptideatlas_2023_09"
            ),
            identical(result$target$ptm_type, "acetylation"),
            identical(
              result$target$modified_sequence,
              "VGYNPDK[Acetyl]IAFVPISGFEGDNMIER"
            ),
            nrow(result$peaks) == 150L,
            nrow(result$matched) > 0L,
            sum(result$key_ions$matched) > 0L,
            abs(result$target$precursor_mz - 904.1109) < 1e-4,
            any(result$summary$Item == "Best raw spectrum"),
            any(result$summary$Item == "Supporting PXD IDs")
          )

          cat(
            "Maize Kac runtime validated:",
            nrow(result$matched), "matched ions;",
            sum(result$key_ions$matched), "/", nrow(result$key_ions),
            "primary b/y ions covered.\n"
          )

      - name: Remove one-shot runtime workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/test-maize-kac-runtime.yml
          git config user.name "liangfei"
          git config user.email "103125590+anhuikylin@users.noreply.github.com"
          git add .github/workflows/test-maize-kac-runtime.yml
          git commit -m "Remove completed maize Kac runtime test workflow"
          git push origin HEAD:dev
