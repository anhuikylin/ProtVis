name: Plant PTM source discovery
on:
  push:
    paths:
      - '.github/workflows/plant-ptm-discovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Inspect public plant methylation and glycosylation sources
        run: |
          python - <<'PY'
          import urllib.request, gzip, xml.etree.ElementTree as E, json, pathlib, sqlite3, concurrent.futures
          out=pathlib.Path("ptm-discovery"); out.mkdir()
          def fetch(url,path):
              errors=[]
              for scheme in ["https","http","ftp"]:
                  try:
                      candidate=scheme+url[url.index(":"):]
                      req=urllib.request.Request(candidate,headers={"User-Agent":"ProtVis data validation"})
                      with urllib.request.urlopen(req,timeout=30) as r: data=r.read()
                      if data.startswith(b"<html") or len(data)<100: raise ValueError("Not a data file")
                      path.write_bytes(data)
                      return path
                  except Exception as e: errors.append(str(e))
              raise RuntimeError("; ".join(errors))
          def methyl():
              base="https://ftp.pride.ebi.ac.uk/pride/data/archive/2024/01/PXD043460/"
              names=["F019538","F019540","F019543","F019545","F019548","F019552","F019602","F019603","F019604","F019605","F019606","F019607"]
              for name in names:
                  try:
                      p=fetch(base+name+".mzid.gz",out/(name+".mzid.gz"))
                      root=E.fromstring(gzip.decompress(p.read_bytes()))
                      peptides={}
                      for e in root.iter():
                          if e.tag.endswith("}Peptide"):
                              seq=next((c.text for c in e if c.tag.endswith("}PeptideSequence")),"")
                              mods=[dict(c.attrib,terms=[a.attrib for a in c]) for c in e if c.tag.endswith("}Modification")]
                              if any(any(abs(float(m.get("monoisotopicMassDelta","0"))-v)<0.01 for v in [14.01565,28.0313,42.04695]) and m.get("residues") in ["K","R"] for m in mods):
                                  peptides[e.attrib["id"]]={"sequence":seq,"mods":mods}
                      hits=[]
                      for r in root.iter():
                          if r.tag.endswith("}SpectrumIdentificationResult"):
                              for item in r:
                                  if item.attrib.get("peptide_ref") in peptides:
                                      hits.append(dict(peptides[item.attrib["peptide_ref"]],result=r.attrib,item=item.attrib,scores=[c.attrib for c in item if c.tag.endswith("}cvParam")]))
                      print("METHYL",name,json.dumps(hits)[:45000],flush=True)
                      (out/(name+".hits.json")).write_text(json.dumps(hits,indent=2))
                      if hits:
                          fetch(base+name+".mgf",out/(name+".mgf"))
                          print("MGF_DOWNLOADED",name,flush=True)
                  except Exception as e: print("METHYL_ERROR",name,str(e),flush=True)
          def glyco():
              base="https://ftp.pride.ebi.ac.uk/pride/data/archive/2017/12/PXD006270/"
              for name in ["160913_Wei_F50.pep.xml","160713_Wei_1B.byspec2_20160725_Byonic.byrslt"]:
                  try:
                      p=fetch(base+name,out/name)
                      print("GLYCO_FILE",name,p.stat().st_size,flush=True)
                      if name.endswith("xml"): print("GLYCO_XML",p.read_text()[:35000],flush=True)
                      else:
                          c=sqlite3.connect(p)
                          for t,sql in c.execute("select name,sql from sqlite_master where type='table'"):
                              print("SQL",t,sql,flush=True)
                              if any(s in t.lower() for s in ["peptide","protein","spectrum","glycan","psm","match"]):
                                  print("ROWS",t,str(c.execute('select * from "'+t+'" limit 2').fetchall())[:10000],flush=True)
                  except Exception as e:print("GLYCO_ERROR",name,str(e),flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              fs=[pool.submit(methyl),pool.submit(glyco)]
              for f in fs:f.result()
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plant-ptm-source-files
          path: ptm-discovery
          retention-days: 7
