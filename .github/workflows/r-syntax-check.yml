name: R Syntax Check

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout companion data
        uses: actions/checkout@v4
        with:
          repository: anhuikylin/ProtVisDatabase
          ref: main
          path: ProtVisDatabase

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Parse R source and tests
        shell: Rscript {0}
        run: |
          files <- c(
            list.files("R", pattern = "\\.[Rr]$", full.names = TRUE),
            list.files("tests/testthat", pattern = "\\.[Rr]$", full.names = TRUE)
          )
          failures <- character()
          for (f in files) {
            tryCatch(
              parse(file = f),
              error = function(e) {
                failures <<- c(failures, paste(f, conditionMessage(e), sep = ": "))
              }
            )
          }
          if (length(failures)) stop(paste(failures, collapse = "\n"))
          cat("Parsed", length(files), "R files successfully.\n")

      - name: Validate archived GSEA reproduction geometry
        shell: Rscript {0}
        run: |
          .protvis_data_file <- function(..., must_work = TRUE) {
            path <- file.path("ProtVisDatabase", "inst", "extdata", ...)
            if (isTRUE(must_work) && !file.exists(path)) {
              stop("Missing companion test resource: ", path, call. = FALSE)
            }
            path
          }
          source("R/gsea.R")
          x <- .protvis_gsea_prepare_archived()
          stopifnot(
            nrow(x$rank_tbl) == 6905L,
            sum(x$rank_tbl$in_pathway) == 196L,
            x$extreme_position == 6202L,
            abs(x$extreme_es - (-0.3984103906)) < 1e-6,
            abs(max(x$rank_tbl$running_ES) - 0.2562033114) < 1e-6,
            abs(min(x$rank_tbl$running_ES) - (-0.3984103906)) < 1e-6,
            abs(max(x$rank_tbl$rank_metric) - 154.317739) < 1e-6,
            abs(min(x$rank_tbl$rank_metric) - (-175.843961)) < 1e-6
          )
          cat("Archived Root_VE phenylpropanoid GSEA geometry validated.\n")

      - name: Validate transcriptome GSEA bundled assets
        shell: Rscript {0}
        run: |
          .protvis_data_file <- function(..., must_work = TRUE) {
            path <- file.path("ProtVisDatabase", "inst", "extdata", ...)
            if (isTRUE(must_work) && !file.exists(path)) {
              stop("Missing companion test resource: ", path, call. = FALSE)
            }
            path
          }
          source("R/DEG.R")
          bg <- .protvis_deg_load_gsea_background()
          ref <- .protvis_deg_load_gsea_reference()
          stopifnot(
            all(c("TERM", "GENE") %in% names(bg$TERM2GENE)),
            all(c("TERM", "NAME") %in% names(bg$TERM2NAME)),
            nrow(bg$TERM2GENE) > 50000L,
            nrow(bg$TERM2NAME) > 150L,
            "00940" %in% bg$TERM2NAME$TERM,
            ref$ID[[1L]] == "00940",
            abs(ref$NES[[1L]] - (-1.360826149505172)) < 1e-12,
            abs(ref$p.adjust[[1L]] - 0.1009765165855614) < 1e-12
          )
          forbidden <- list.files(
            "inst/extdata/transcriptome_gsea",
            pattern = "expression|group|sample",
            ignore.case = TRUE
          )
          stopifnot(length(forbidden) == 0L)
          cat("Transcriptome GSEA bundled assets validated.\n")

      - name: Validate PTM phosphorylation and maize Kac benchmarks
        shell: Rscript {0}
        run: |
          source("R/ptm_vac14.R")

          phospho <- .protvis_vac14_theoretical()
          stopifnot(
            abs(phospho$precursor_2plus - 632.784111) < 1e-6,
            phospho$fragment_table$AA[[3L]] == "S+80",
            any(phospho$candidates$label == "b3-98")
          )

          kac_mod <- data.frame(
            location = 7L,
            mass = 42.010565,
            name = "Acetyl",
            stringsAsFactors = FALSE
          )
          kac <- .protvis_ptm_theoretical(
            "VGYNPDKIAFVPISGFEGDNMIER",
            kac_mod
          )
          kac_label <- .protvis_modified_sequence_label(
            "VGYNPDKIAFVPISGFEGDNMIER",
            kac_mod
          )
          proton <- 1.007276466621
          kac_mz3 <- (kac$mh + 2 * proton) / 3
          stopifnot(
            identical(
              kac_label,
              "VGYNPDK[Acetyl]IAFVPISGFEGDNMIER"
            ),
            abs(kac_mz3 - 904.1108942) < 1e-6,
            !any(grepl("-98", kac$candidates$label, fixed = TRUE))
          )

          root <- file.path(
            "ProtVisDatabase", "inst", "extdata", "ptm", "maize_kac"
          )
          meta_file <- file.path(
            root,
            "maize_peptideatlas_kac_VGYNPDK_Acetyl.tsv"
          )
          mgf_file <- file.path(
            root,
            "maize_peptideatlas_kac_VGYNPDK_Acetyl.mgf"
          )
          stopifnot(file.exists(meta_file), file.exists(mgf_file))

          meta <- utils::read.delim(
            meta_file,
            sep = "\t",
            stringsAsFactors = FALSE,
            check.names = FALSE
          )
          values <- stats::setNames(meta$value, meta$field)
          stopifnot(
            values[["modified_peptide"]] ==
              "VGYNPDK[Acetyl]IAFVPISGFEGDNMIER",
            values[["modified_position"]] == "7",
            values[["mass_shift_da"]] == "42.010565",
            values[["peptideatlas_probability"]] == "1.0000",
            values[["library_num_peaks"]] == "150",
            values[["best_raw_source_pxd"]] == "PXD002379"
          )

          mgf <- readLines(mgf_file, warn = FALSE)
          peak_lines <- grepl(
            "^[0-9]+(?:\\.[0-9]+)?[[:space:]]+[0-9]+",
            mgf
          )
          stopifnot(
            sum(peak_lines) == 150L,
            any(mgf == "PEPMASS=904.110900"),
            any(mgf == "CHARGE=3+")
          )

          peak_text <- strsplit(
            trimws(mgf[peak_lines]),
            "[[:space:]]+"
          )
          peak_matrix <- do.call(
            rbind,
            lapply(peak_text, as.numeric)
          )
          peaks <- data.frame(
            mz = peak_matrix[, 1L],
            intensity = peak_matrix[, 2L]
          )
          peaks$rel <- peaks$intensity / max(peaks$intensity) * 100

          matched <- .protvis_vac14_match_ions(
            peaks,
            kac$candidates,
            tolerance_da = 0.05
          )
          coverage <- kac$key_ions
          coverage$matched <- vapply(
            coverage$mz,
            function(mz) min(abs(peaks$mz - mz), na.rm = TRUE) <= 0.05,
            logical(1L)
          )
          stopifnot(
            nrow(matched) == 37L,
            nrow(coverage) == 46L,
            sum(coverage$matched) == 21L,
            max(abs(matched$error_da)) < 0.05
          )

          source_text <- paste(
            readLines("R/ptm_vac14.R", warn = FALSE),
            collapse = "\n"
          )
          generic_server <- tail(
            strsplit(
              source_text,
              ".protvis_vac14_server <- function",
              fixed = TRUE
            )[[1L]],
            1L
          )
          stopifnot(
            grepl(
              "output$vac14_benchmark_note",
              generic_server,
              fixed = TRUE
            ),
            grepl(
              "output$vac14_benchmark_info",
              generic_server,
              fixed = TRUE
            ),
            grepl(
              "PeptideAtlas_consensus_fragment_matching",
              generic_server,
              fixed = TRUE
            )
          )
          cat(
            "PTM phosphorylation and maize Kac benchmarks validated; ",
            "37 Kac fragments matched at 0.05 Da with 21/46 primary b/y ions covered.\n",
            sep = ""
          )

      - name: Validate quiet startup dependency graph
        shell: Rscript {0}
        run: |
          desc <- read.dcf("DESCRIPTION")
          imports <- strsplit(desc[1, "Imports"], ",")[[1]]
          imports <- trimws(gsub("\\n", "", imports))
          noisy <- c(
            "GseaVis", "ggpubr", "pathview",
            "golem", "clusterProfiler", "enrichplot", "fgsea"
          )
          stopifnot(!any(noisy %in% imports))

          ns <- readLines("NAMESPACE", warn = FALSE)
          forbidden <- c(
            "importFrom(GseaVis,gseaNb)",
            "importFrom(ggpubr,compare_means)",
            "importFrom(ggpubr,stat_compare_means)",
            "importFrom(pathview,pathview)",
            "importFrom(golem,bundle_resources)",
            "importFrom(golem,with_golem_options)",
            "importFrom(clusterProfiler,GSEA)",
            "importFrom(clusterProfiler,dotplot)",
            "importFrom(clusterProfiler,enricher)"
          )
          stopifnot(!any(forbidden %in% ns))
          cat("Optional plotting packages are excluded from eager startup imports.\n")

      - name: Validate DESCRIPTION and new help pages
        shell: Rscript {0}
        run: |
          read.dcf("DESCRIPTION")
          rd <- c(
            "man/protvis_architecture.Rd",
            "man/protvis_dashboard_ui.Rd",
            "man/psm_explorer_ui.Rd",
            "man/run_protvis_cli.Rd",
            "man/fragpipe_search.Rd",
            "man/protvis_runs_v4.Rd"
          )
          for (f in rd) tools::checkRd(f)
          cat("DESCRIPTION and new Rd files validated.\n")


      - name: Validate schema v4 source contract
        shell: Rscript {0}
        run: |
          runs <- paste(readLines("R/protvis_runs_v4.R", warn = FALSE), collapse = "\n")
          dataset <- paste(readLines("R/protvis_dataset.R", warn = FALSE), collapse = "\n")
          architecture <- paste(readLines("R/protvis_architecture.R", warn = FALSE), collapse = "\n")
          required <- c(
            "analysis_results$v4$runs",
            "active_matrix_run_id",
            "protvis_activate_result",
            "record_protvis_output",
            "result_registry"
          )
          missing <- required[!vapply(required, function(x) {
            grepl(x, paste(runs, dataset, architecture, sep = "\n"), fixed = TRUE)
          }, logical(1))]
          if (length(missing)) {
            stop("Missing schema-v4 contract markers: ", paste(missing, collapse = ", "))
          }
          cat("Schema v4 append-only source contract present.\n")


      - name: Run schema v4 core smoke tests
        shell: Rscript {0}
        run: |
          source("R/protvis_dataset.R")
          source("R/protvis_architecture.R")
          source("R/protvis_runs_v4.R")

          expression <- data.frame(
            S1 = c(1, 2, 3),
            S2 = c(4, 5, 6),
            row.names = c("P1", "P2", "P3"),
            check.names = FALSE
          )
          object <- create_protvis_dataset(expression)
          stopifnot(
            identical(object$version, "4.0.0"),
            is.data.frame(object$result_registry),
            nzchar(object$workflow$active_matrix_run_id)
          )

          object <- record_protvis_output(
            object,
            module = "smoke_analysis",
            method = "first",
            tables = list(result = data.frame(id = "P1", value = 1)),
            plot_data = list(points = data.frame(x = 1, y = 2)),
            parameters = list(alpha = 0.05)
          )
          object <- record_protvis_output(
            object,
            module = "smoke_analysis",
            method = "second",
            tables = list(result = data.frame(id = "P2", value = 2)),
            plot_data = list(points = data.frame(x = 2, y = 4)),
            parameters = list(alpha = 0.01)
          )
          history <- protvis_result_history(object, "smoke_analysis")
          stopifnot(
            length(history) == 2L,
            identical(history[[1L]]$method, "first"),
            identical(history[[2L]]$method, "second"),
            isTRUE(history[[1L]]$sealed),
            isTRUE(history[[2L]]$sealed)
          )

          first_matrix <- expression + 10
          second_matrix <- expression + 20
          object <- add_protvis_run(
            object, "normalization", method = "median",
            expression_data = first_matrix
          )
          first_id <- protvis_latest_result(object, "normalization")$run_id
          object <- add_protvis_run(
            object, "normalization", method = "vsn",
            expression_data = second_matrix
          )
          stopifnot(isTRUE(all.equal(
            as.matrix(object$expression_data),
            as.matrix(second_matrix),
            check.attributes = FALSE
          )))
          object <- protvis_activate_result(object, first_id)
          stopifnot(
            identical(object$workflow$active_matrix_run_id, first_id),
            isTRUE(all.equal(
              as.matrix(object$expression_data),
              as.matrix(first_matrix),
              check.attributes = FALSE
            ))
          )

          local_run <- list(
            method = "local_engine",
            parameters = list(beta = 0.5),
            tables = list(summary = data.frame(metric = "n", value = 3))
          )
          object <- .protvis_append_analysis_run(
            object, "local_module", local_run, run_id = "local_smoke_1"
          )
          mirrored <- protvis_latest_result(object, "local_module")
          stopifnot(
            identical(mirrored$method, "local_engine"),
            is.data.frame(mirrored$results$tables$summary),
            identical(mirrored$parameters$beta, 0.5)
          )

          cat("Schema v4 core smoke tests passed.\n")
