<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">ProtVis molecular logo</title>
  <desc id="desc">A complete blue molecular structure on a dark scientific background, enclosed by a closed geometric frame.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102b4b"/>
      <stop offset="0.55" stop-color="#071a31"/>
      <stop offset="1" stop-color="#030d1b"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9bdcff"/>
      <stop offset="0.5" stop-color="#397db4"/>
      <stop offset="1" stop-color="#b8eaff"/>
    </linearGradient>
    <radialGradient id="sphere" cx="30%" cy="24%" r="80%">
      <stop offset="0" stop-color="#f3fdff"/>
      <stop offset="0.2" stop-color="#a9e4ff"/>
      <stop offset="0.58" stop-color="#438bc3"/>
      <stop offset="0.85" stop-color="#14507f"/>
      <stop offset="1" stop-color="#082b4d"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#2d9ce7" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2d9ce7" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="shield">
      <path d="M320 18 584 170 584 330 56 330 56 170Z"/>
    </clipPath>
  </defs>

  <rect width="640" height="420" rx="24" fill="#f7fbff"/>
  <path d="M320 18 584 170 584 330 56 330 56 170Z" fill="url(#frame)" stroke="#020912" stroke-width="7" stroke-linejoin="round"/>
  <g clip-path="url(#shield)">
    <rect x="50" y="16" width="540" height="320" fill="url(#frame)"/>
    <ellipse cx="333" cy="218" rx="270" ry="180" fill="url(#glow)"/>

    <g fill="#d9f4ff">
      <circle cx="120" cy="144" r="1.8" opacity=".8"/><circle cx="154" cy="204" r="1.2" opacity=".7"/>
      <circle cx="180" cy="103" r="1.5" opacity=".65"/><circle cx="210" cy="235" r="1.4" opacity=".7"/>
      <circle cx="248" cy="83" r="1.2" opacity=".8"/><circle cx="279" cy="125" r="1.5" opacity=".65"/>
      <circle cx="312" cy="68" r="1.3" opacity=".8"/><circle cx="365" cy="92" r="1.5" opacity=".75"/>
      <circle cx="404" cy="118" r="1.1" opacity=".8"/><circle cx="448" cy="88" r="1.7" opacity=".7"/>
      <circle cx="500" cy="145" r="1.4" opacity=".8"/><circle cx="531" cy="203" r="1.7" opacity=".7"/>
      <circle cx="495" cy="264" r="1.3" opacity=".7"/><circle cx="454" cy="292" r="1.2" opacity=".7"/>
      <circle cx="168" cy="285" r="1.3" opacity=".75"/><circle cx="111" cy="251" r="1.7" opacity=".65"/>
      <circle cx="236" cy="310" r="1.1" opacity=".75"/><circle cx="384" cy="311" r="1.4" opacity=".75"/>
    </g>

    <path d="M72 286 C145 249 189 299 258 275 S385 246 453 278 537 294 574 269" fill="none" stroke="#3a9ce2" stroke-width="2.5" opacity=".72" filter="url(#softGlow)"/>
    <path d="M72 300 C150 267 203 315 276 292 S412 270 481 299 542 308 574 293" fill="none" stroke="#b9ecff" stroke-width="1.2" opacity=".58"/>

    <g fill="none" stroke="#8dd8ff" stroke-width="8" stroke-linecap="round" opacity=".9" filter="url(#softGlow)">
      <path d="M228 163 312 126 369 190 446 174"/>
      <path d="M312 126 335 232 269 272"/>
      <path d="M369 190 423 263 335 232"/>
      <path d="M446 174 484 224"/>
    </g>
    <g fill="none" stroke="#d8f4ff" stroke-width="3.5" stroke-linecap="round">
      <path d="M228 163 312 126 369 190 446 174"/>
      <path d="M312 126 335 232 269 272"/>
      <path d="M369 190 423 263 335 232"/>
      <path d="M446 174 484 224"/>
    </g>

    <g stroke="#d8f5ff" stroke-opacity=".7" stroke-width="1.4">
      <circle cx="228" cy="163" r="25" fill="url(#sphere)"/>
      <circle cx="312" cy="126" r="22" fill="url(#sphere)"/>
      <circle cx="369" cy="190" r="31" fill="url(#sphere)"/>
      <circle cx="446" cy="174" r="22" fill="url(#sphere)"/>
      <circle cx="484" cy="224" r="19" fill="url(#sphere)"/>
      <circle cx="335" cy="232" r="25" fill="url(#sphere)"/>
      <circle cx="269" cy="272" r="22" fill="url(#sphere)"/>
      <circle cx="423" cy="263" r="21" fill="url(#sphere)"/>
    </g>
    <g fill="#ffffff" opacity=".86">
      <ellipse cx="220" cy="154" rx="7" ry="4.2" transform="rotate(-28 220 154)"/>
      <ellipse cx="306" cy="118" rx="6.5" ry="3.8" transform="rotate(-28 306 118)"/>
      <ellipse cx="357" cy="179" rx="9" ry="5.2" transform="rotate(-28 357 179)"/>
      <ellipse cx="440" cy="166" rx="6.5" ry="3.7" transform="rotate(-28 440 166)"/>
      <ellipse cx="478" cy="218" rx="5.8" ry="3.3" transform="rotate(-28 478 218)"/>
      <ellipse cx="327" cy="222" rx="7" ry="4" transform="rotate(-28 327 222)"/>
      <ellipse cx="262" cy="264" rx="6" ry="3.4" transform="rotate(-28 262 264)"/>
      <ellipse cx="416" cy="255" rx="5.8" ry="3.4" transform="rotate(-28 416 255)"/>
    </g>
  </g>
  <path d="M320 18 584 170 584 330 56 330 56 170Z" fill="none" stroke="url(#edge)" stroke-width="4" stroke-linejoin="round"/>
</svg>